<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>客服工作台 · NewCrisp</title>
  <link rel="stylesheet" href="/identity.css">
  <script type="module" src="/staff.js"></script>
</head>
<body class="chat-page">
  <main>
    <h1 id="heading">租户管理员登录</h1>
    <p id="feedback" role="status" aria-live="polite"></p>
    <form id="login" hidden>
      <label>租户代码<input name="tenantCode" required autocomplete="organization" pattern="[a-z][a-z0-9\-]{2,47}"></label>
      <label>邮箱<input name="email" required type="email" autocomplete="username" maxlength="254"></label>
      <label>密码<input name="password" required type="password" autocomplete="current-password" maxlength="72"></label>
      <button type="submit">登录</button>
    </form>
    <section id="profile" aria-labelledby="heading" hidden>
      <p id="workspace"></p>
      <p id="email"></p>
      <button id="logout" type="button">退出登录</button>
    </section>
    <form id="member" hidden>
      <h2>添加客服成员</h2>
      <label>部门代码<input name="departmentCode" value="support" required></label>
      <label>成员邮箱<input name="email" type="email" required autocomplete="off"></label>
      <label>客服称呼<input name="displayName" maxlength="64"></label>
      <label>初始密码<input name="password" required minlength="12" maxlength="72" type="password" autocomplete="new-password"></label>
      <label>职责<select name="role"><option value="AGENT">客服</option><option value="SUPERVISOR">主管</option></select></label>
      <button type="submit">创建成员</button>
    </form>
    <section id="chat" aria-label="客服工作台" hidden></section>
  </main>
</body>
</html>
