server:
  address: 127.0.0.1
spring:
  application:
    name: newcrisp
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  task:
    scheduling:
      pool:
        size: 2
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  flyway:
    clean-disabled: true
    validate-on-migrate: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
newcrisp:
  identity:
    public-origin: ${NEWCRISP_PUBLIC_ORIGIN:http://127.0.0.1:8080}
    platform-key-sha256: ${NEWCRISP_PLATFORM_KEY_SHA256:}
    nexus-verify-url: ${NEWCRISP_NEXUS_VERIFY_URL:}
    nexus-verify-key: ${NEWCRISP_NEXUS_VERIFY_KEY:}
    nexus-verification-ttl: ${NEWCRISP_NEXUS_VERIFICATION_TTL:60s}
    self-signup-enabled: ${NEWCRISP_SELF_SIGNUP_ENABLED:true}
    landing-demo-site-id: ${NEWCRISP_LANDING_DEMO_SITE_ID:}
