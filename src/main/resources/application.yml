server:
  address: 127.0.0.1
spring:
  application:
    name: newcrisp
  sql:
    init:
      mode: never
  flyway:
    clean-disabled: true
    validate-on-migrate: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
